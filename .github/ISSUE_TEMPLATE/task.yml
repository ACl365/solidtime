name: Task
description: Small task or enhancement for the studio
labels: [task]
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Short task title
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What needs to be done?
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist (optional)
      options:
        - label: Update docs if needed
        - label: Run local checks before pushing

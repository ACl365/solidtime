name: Bug report
description: Report a bug in Pia Time
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide minimal steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Org, Project, Browser/OS (if relevant)
    validations:
      required: false
